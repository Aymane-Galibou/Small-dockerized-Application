version: '3.8'

services:
  frontend:
    build: 
      context: ./client-react
      dockerfile: Dockerfile
    ports:
      - "80:80" # Only this is exposed to your laptop
    depends_on:
      - api-node
      - api-golang

  api-node:
    build: ./api-node
    expose:
      - "3000" # Internal communication only
    environment:
      - DB_HOST=db
    depends_on:
      - db

  api-golang:
    build: 
      context: ./api-golang
      dockerfile: Dockerfile # Fixed the path
    expose:
      - "8080" # Internal communication only
    environment:
      - DATABASE_URL=postgres://postgres:foobarbaz@db:5432/postgres
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:15
    expose:
      - "5432" # Hidden from the public
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: foobarbaz
      POSTGRES_DB: postgres